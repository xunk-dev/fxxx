name: Screen matrix
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.switch.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: switch
        run: bash scripts/test-switch.sh || true
  screens:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: ${{ matrix.api == 24 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: small-phone-api24, api: 24, target: default, profile: "Nexus 5", ram: 2048M }
          - { name: phone-api29, api: 29, target: google_apis, profile: pixel_6, ram: 4096M }
          - { name: tablet-10-api29, api: 29, target: google_apis, profile: "10.1in WXGA (Tablet)", ram: 4096M, cores: 4 }
          - { name: pixel-c-api30, api: 30, target: google_apis, profile: pixel_c, ram: 4096M, cores: 4 }
          - { name: foldable-7-6-api34, api: 34, target: google_apis, profile: "7.6in Foldable", ram: 4096M, cores: 4 }
          - { name: foldable-8-api34, api: 34, target: google_apis, profile: "8in Foldable", ram: 4096M, cores: 4 }
          - { name: pixel-fold-api34, api: 34, target: google_apis, profile: pixel_fold, ram: 4096M, cores: 4 }
          - { name: pixel-tablet-api34, api: 34, target: google_apis, profile: pixel_tablet, ram: 4096M, cores: 4 }
          - { name: pixel-tablet-api37, api: 37, target: google_apis, profile: pixel_tablet, ram: 4096M, cores: 4 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove stale files
        run: bash scripts/remove-stale-files.sh
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.7.1"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update Android cmdline-tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;latest" > /dev/null
          if [ -d "$SDK/cmdline-tools/latest-2" ]; then
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/latest-2" "$SDK/cmdline-tools/latest"
          fi
      - name: Cap Gradle memory
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8\nkotlin.daemon.jvmargs=-Xmx2g\norg.gradle.workers.max=2\n' >> ~/.gradle/gradle.properties
      - name: Build test APKs before the emulator starts
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest -PdeviceTest=on --no-daemon
      - name: Screen tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api == 37 && '37.0' || matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: ${{ matrix.cores || 2 }}
          ram-size: ${{ matrix.ram }}
          heap-size: 576M
          disk-size: 6144M
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu ${{ matrix.api == 34 && 'swangle_indirect' || 'swiftshader_indirect' }} -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/run-full-suite.sh screens-${{ matrix.name }} screens
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screens-${{ matrix.name }}
          path: build/suite-results
          if-no-files-found: ignore
