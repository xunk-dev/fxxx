org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# on = ابنِ كل النسخ (arm64 + armeabi-v7a + x86_64 + universal) | off = نسخة arm64 فقط
allAbis=off

# رقم مشروع Google Cloud المربوط بالتطبيق في Play Console (Play Integrity). القيمة من google-services.json (project_number).
# تحقق أنه نفس المشروع المربوط في Play Console > Test and release > App integrity. القيمة 0 تعطّل الفحص.
integrityCloudProject=116798261326
